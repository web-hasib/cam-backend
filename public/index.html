<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PhoneCam - Mobile Camera Broadcaster</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #cameraView {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #000000;
    }
    .mirror {
      transform: scaleX(-1);
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding-top: max(env(safe-area-inset-top, 24px), 36px);
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 28px);
      padding-left: 16px;
      padding-right: 16px;
    }
    .ui-interactive {
      pointer-events: auto;
    }
    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-badge {
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
      transition: background-color 0.3s;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.standby {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    .status-dot.error {
      background: #ef4444;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .room-badge {
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-family: monospace;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    .btn-disconnect-header {
      background: rgba(225, 29, 72, 0.9);
      border: 1px solid #f43f5e;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
      transition: all 0.15s ease;
    }
    .btn-disconnect-header:active {
      transform: scale(0.94);
      background: #be123c;
    }

    /* Standby Banner */
    .standby-banner {
      display: none;
      align-self: center;
      background: rgba(11, 17, 32, 0.92);
      border: 1px solid #38bdf8;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      margin-top: 10px;
    }
    .standby-banner.active {
      display: block;
    }
    .standby-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .btn-takeover {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.5);
      transition: opacity 0.15s;
    }
    .btn-takeover:active {
      opacity: 0.85;
    }

    /* Bottom Controls */
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding-bottom: 6px;
      gap: 12px;
    }
    .btn-tool {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
    }
    .btn-tool:active {
      transform: scale(0.92);
      background: rgba(30, 41, 59, 0.95);
    }
    .btn-tool.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }
    .btn-tool.danger {
      background: #e11d48;
      border-color: #f43f5e;
      color: #ffffff;
    }
    .btn-main {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 2px solid #38bdf8;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.5);
      transition: transform 0.1s;
    }
    .btn-main:active {
      transform: scale(0.92);
    }

    /* OLED Dimmer */
    .dimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
    }
    .dimmer.active {
      display: flex;
    }
    .dimmer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-bottom: 12px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Pair Modal */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .text-input {
      width: 100%;
      background: #030712;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      font-family: monospace;
      outline: none;
      text-transform: uppercase;
    }
    .text-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .btn-start {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-start:active {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <!-- Camera Viewfinder -->
  <video id="cameraView" autoplay playsinline muted></video>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <!-- Top Bar -->
    <div class="top-header ui-interactive">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>

      <div class="top-actions">
        <div class="room-badge" id="roomBadge">ROOM: ----</div>
        <button class="btn-disconnect-header" id="btnDisconnectHeader" title="Exit Stream">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Exit</span>
        </button>
      </div>
    </div>

    <!-- Standby Switcher Banner -->
    <div class="standby-banner ui-interactive" id="standbyBanner">
      <div class="standby-text">Another camera is active</div>
      <button class="btn-takeover" id="btnTakeover">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Switch to This Phone</span>
      </button>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls ui-interactive">
      <!-- Torch Button -->
      <button class="btn-tool" id="btnTorch" title="Flashlight">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </button>

      <!-- Mute Mic Button -->
      <button class="btn-tool" id="btnMute" title="Microphone">
        <svg id="svgMicOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <svg id="svgMicOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Flip Camera Button (Center Main) -->
      <button class="btn-main" id="btnFlip" title="Flip Camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
          <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"></path>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="m18 22-3-3 3-3"></path>
          <path d="m6 2 3 3-3 3"></path>
        </svg>
      </button>

      <!-- OLED Dimmer Button -->
      <button class="btn-tool" id="btnDimmer" title="OLED Saver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Settings / Room ID Button -->
      <button class="btn-tool" id="btnSettings" title="Room Code">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- OLED Battery Saver Dimmer -->
  <div class="dimmer" id="dimmerOverlay">
    <div class="dimmer-dot"></div>
    <div style="font-size: 13px; font-weight: 600; color: #f1f5f9;">Live Streaming to PC</div>
    <div style="font-size: 11px; margin-top: 6px; color: #64748b;">Tap anywhere to wake display</div>
  </div>

  <!-- Connect / Settings Modal -->
  <div class="modal" id="pairModal" style="display: none;">
    <div class="modal-card">
      <h3 class="modal-title">Pair with Desktop</h3>
      <p class="modal-desc">Enter the 8-character Session ID shown on your Desktop PhoneCam Studio screen.</p>
      
      <div class="input-group">
        <label class="input-label">SESSION / ROOM ID</label>
        <input type="text" id="inputRoomId" class="text-input" placeholder="KLRC-KWV5" maxlength="9" autofocus>
      </div>

      <button class="btn-start" id="btnConnectRoom">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Start Live Stream</span>
      </button>
    </div>
  </div>

  <script>
    // Configuration & State
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:stun3.l.google.com:19302" },
        { urls: "stun:stun4.l.google.com:19302" },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelay",
          credential: "openrelay"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelay",
          credential: "openrelay"
        },
        {
          urls: "turn:openrelay.metered.ca:443?transport=tcp",
          username: "openrelay",
          credential: "openrelay"
        }
      ],
      iceCandidatePoolSize: 10
    };

    let localStream = null;
    let peerConnection = null;
    let socket = null;
    let currentFacing = "environment";
    let isMuted = false;
    let isTorchOn = false;
    let iceQueue = [];
    let frameInterval = null;
    let isBroadcaster = true;
    let myDeviceName = "Phone Camera (" + (navigator.userAgent.includes("iPhone") ? "iOS" : "Android") + ")";

    const offscreenCanvas = document.createElement("canvas");
    const offscreenCtx = offscreenCanvas.getContext("2d");

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    let targetRoom = (urlParams.get("room") || "").trim().toUpperCase();

    // DOM Elements
    const cameraView = document.getElementById("cameraView");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const roomBadge = document.getElementById("roomBadge");
    const btnDisconnectHeader = document.getElementById("btnDisconnectHeader");
    const standbyBanner = document.getElementById("standbyBanner");
    const btnTakeover = document.getElementById("btnTakeover");
    const btnFlip = document.getElementById("btnFlip");
    const btnTorch = document.getElementById("btnTorch");
    const btnMute = document.getElementById("btnMute");
    const svgMicOn = document.getElementById("svgMicOn");
    const svgMicOff = document.getElementById("svgMicOff");
    const btnDimmer = document.getElementById("btnDimmer");
    const btnSettings = document.getElementById("btnSettings");
    const dimmerOverlay = document.getElementById("dimmerOverlay");
    const pairModal = document.getElementById("pairModal");
    const inputRoomId = document.getElementById("inputRoomId");
    const btnConnectRoom = document.getElementById("btnConnectRoom");

    function setStatus(text, type = "normal") {
      statusText.textContent = text;
      statusDot.className = "status-dot";
      if (type === "connected") statusDot.classList.add("connected");
      if (type === "standby") statusDot.classList.add("standby");
      if (type === "error") statusDot.classList.add("error");
    }

    function updateBroadcasterState(active) {
      isBroadcaster = active;
      if (isBroadcaster) {
        standbyBanner.classList.remove("active");
        setStatus("Live (Active)", "connected");
      } else {
        standbyBanner.classList.add("active");
        setStatus("Standby", "standby");
      }
    }

    function exitStream() {
      if (frameInterval) clearInterval(frameInterval);
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
      }
      if (socket) {
        socket.disconnect();
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      // Notify React Native WebView if present
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage("disconnect");
      } else {
        pairModal.style.display = "flex";
        setStatus("Disconnected", "error");
      }
    }

    btnDisconnectHeader.addEventListener("click", exitStream);

    // Frame streaming
    function startFrameStreaming() {
      if (frameInterval) clearInterval(frameInterval);
      frameInterval = setInterval(() => {
        if (
          socket &&
          socket.connected &&
          targetRoom &&
          localStream &&
          cameraView.videoWidth > 0 &&
          isBroadcaster
        ) {
          const w = 640;
          const h = Math.round((w * cameraView.videoHeight) / cameraView.videoWidth) || 480;
          if (offscreenCanvas.width !== w || offscreenCanvas.height !== h) {
            offscreenCanvas.width = w;
            offscreenCanvas.height = h;
          }
          offscreenCtx.drawImage(cameraView, 0, 0, w, h);
          const dataUrl = offscreenCanvas.toDataURL("image/jpeg", 0.6);
          socket.emit("video-frame", {
            roomId: targetRoom,
            image: dataUrl,
            fromSocketId: socket.id
          });
        }
      }, 40); // 25 fps
    }

    // Start Camera
    async function initCamera(facingMode = currentFacing) {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }

      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
      } catch (e1) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode },
            audio: false
          });
        } catch (e2) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          } catch (e3) {
            console.error("Camera access failed completely:", e3);
            setStatus("Camera Access Denied", "error");
            return;
          }
        }
      }

      localStream = stream;
      cameraView.srcObject = localStream;
      cameraView.className = (facingMode === "user") ? "mirror" : "";
      currentFacing = facingMode;

      cameraView.onloadedmetadata = () => {
        cameraView.play().catch(() => {});
        startFrameStreaming();
      };
      startFrameStreaming();

      try {
        const videoTrack = localStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        btnTorch.style.display = capabilities.torch ? "flex" : "none";
      } catch (e) {}

      if (peerConnection && peerConnection.signalingState !== "closed") {
        const senders = peerConnection.getSenders();
        localStream.getTracks().forEach(track => {
          const sender = senders.find(s => s.track && s.track.kind === track.kind);
          if (sender) {
            sender.replaceTrack(track);
          }
        });
      }
    }

    // Toggle Torch
    async function toggleTorch() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({
          advanced: [{ torch: isTorchOn }]
        });
        btnTorch.classList.toggle("active", isTorchOn);
      } catch (err) {
        console.warn("Torch not supported:", err);
      }
    }

    // WebRTC Offer
    async function startWebRTCStream() {
      if (!targetRoom || !socket || !socket.connected) return;

      if (!localStream || !localStream.active || localStream.getVideoTracks().length === 0) {
        setStatus("Initializing camera...");
        await initCamera(currentFacing);
      }

      if (!localStream) {
        setStatus("Camera Unavailable", "error");
        return;
      }

      if (peerConnection && peerConnection.signalingState !== "closed") {
        try { peerConnection.close(); } catch (e) {}
      }

      peerConnection = new RTCPeerConnection(RTC_CONFIG);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && socket && socket.connected) {
          socket.emit("ice-candidate", {
            roomId: targetRoom,
            candidate: event.candidate,
            from: "mobile",
            fromSocketId: socket.id
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        if (state === "connected") {
          updateBroadcasterState(isBroadcaster);
        } else if (state === "disconnected" || state === "failed") {
          setStatus("Reconnecting...", "error");
        }
      };

      try {
        const offer = await peerConnection.createOffer({
          offerToReceiveVideo: false,
          offerToReceiveAudio: false
        });
        await peerConnection.setLocalDescription(offer);

        socket.emit("webrtc-offer", {
          roomId: targetRoom,
          sdp: offer,
          from: "mobile",
          fromSocketId: socket.id,
          deviceName: myDeviceName
        });
      } catch (err) {
        console.error("Error creating WebRTC offer:", err);
      }
    }

    // Connect Socket.IO
    function connectSocket() {
      if (!targetRoom) {
        pairModal.style.display = "flex";
        setStatus("Enter Session ID");
        return;
      }

      roomBadge.textContent = "ROOM: " + targetRoom;
      setStatus("Connecting to server...");

      if (socket) {
        socket.disconnect();
      }

      socket = io({
        transports: ["websocket", "polling"],
        timeout: 10000
      });

      socket.on("connect", () => {
        setStatus("Joining room...");
        socket.emit("join-room", {
          roomId: targetRoom,
          clientType: "mobile",
          deviceName: myDeviceName
        }, (res) => {
          if (res) {
            updateBroadcasterState(res.isBroadcasting !== false);
          }
        });
        setTimeout(startWebRTCStream, 400);
      });

      socket.on("peer-joined", async (data) => {
        if (data.clientType === "desktop") {
          setStatus("Desktop connected...");
          await startWebRTCStream();
        }
      });

      socket.on("active-camera-changed", (data) => {
        const amIActive = data.activeSocketId === socket.id;
        updateBroadcasterState(amIActive);
      });

      socket.on("device-list-updated", (data) => {
        if (data.activeSocketId) {
          updateBroadcasterState(data.activeSocketId === socket.id);
        }
      });

      socket.on("webrtc-answer", async (data) => {
        if (!peerConnection) return;
        try {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          while (iceQueue.length > 0) {
            const cand = iceQueue.shift();
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
            } catch (e) {}
          }
          updateBroadcasterState(isBroadcaster);
        } catch (err) {
          console.error("Failed to set remote description:", err);
        }
      });

      socket.on("ice-candidate", async (data) => {
        try {
          if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          } else {
            iceQueue.push(data.candidate);
          }
        } catch (err) {}
      });

      socket.on("peer-disconnected", (data) => {
        if (data && data.allDisconnected) {
          setStatus("Desktop disconnected", "error");
        }
      });

      socket.on("connect_error", () => {
        setStatus("Server offline", "error");
      });
    }

    // Takeover button
    btnTakeover.addEventListener("click", () => {
      if (socket && socket.connected && targetRoom) {
        socket.emit("switch-active-camera", {
          roomId: targetRoom,
          targetSocketId: socket.id
        });
        updateBroadcasterState(true);
      }
    });

    btnFlip.addEventListener("click", () => {
      const nextFacing = (currentFacing === "environment") ? "user" : "environment";
      isTorchOn = false;
      btnTorch.classList.remove("active");
      initCamera(nextFacing);
    });

    btnTorch.addEventListener("click", toggleTorch);

    btnMute.addEventListener("click", () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      btnMute.classList.toggle("danger", isMuted);
      if (isMuted) {
        svgMicOn.style.display = "none";
        svgMicOff.style.display = "block";
      } else {
        svgMicOn.style.display = "block";
        svgMicOff.style.display = "none";
      }
    });

    btnDimmer.addEventListener("click", () => {
      dimmerOverlay.classList.add("active");
    });

    dimmerOverlay.addEventListener("click", () => {
      dimmerOverlay.classList.remove("active");
    });

    btnSettings.addEventListener("click", () => {
      inputRoomId.value = targetRoom;
      pairModal.style.display = "flex";
    });

    btnConnectRoom.addEventListener("click", async () => {
      const code = inputRoomId.value.trim().toUpperCase();
      if (!code) return;
      targetRoom = code;
      pairModal.style.display = "none";
      const newUrl = window.location.pathname + "?room=" + encodeURIComponent(targetRoom);
      window.history.replaceState({}, "", newUrl);
      connectSocket();
      await startWebRTCStream();
    });

    // Auto-init on page load
    (async function init() {
      await initCamera("environment");
      connectSocket();
    })();
  </script>
</body>
</html>
