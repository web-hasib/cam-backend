<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PhoneCam Studio Broadcaster</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #cameraView {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #000000;
    }
    .mirror {
      transform: scaleX(-1);
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding-top: max(env(safe-area-inset-top, 24px), 32px);
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 28px);
      padding-left: 16px;
      padding-right: 16px;
    }
    .ui-interactive {
      pointer-events: auto;
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-badge {
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      max-width: 55%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
      transition: background-color 0.3s;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.standby {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    .status-dot.error {
      background: #ef4444;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .room-badge {
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-family: monospace;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .btn-disconnect-header {
      background: rgba(225, 29, 72, 0.92);
      border: 1px solid #f43f5e;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
      transition: transform 0.1s;
    }
    .btn-disconnect-header:active {
      transform: scale(0.92);
      background: #be123c;
    }

    /* Live Telemetry Pill */
    .telemetry-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .telemetry-pill {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .telemetry-val {
      color: #38bdf8;
      font-family: monospace;
    }

    /* Standby Banner */
    .standby-banner {
      display: none;
      align-self: center;
      background: rgba(11, 17, 32, 0.92);
      border: 1px solid #38bdf8;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      margin-top: 10px;
    }
    .standby-banner.active {
      display: block;
    }
    .standby-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .btn-takeover {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.5);
    }

    /* Tap to focus reticle */
    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1.5px solid #38bdf8;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.3);
      transition: opacity 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }
    .focus-ring.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Bottom Controls */
    .bottom-controls-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      max-width: 420px;
      gap: 12px;
    }
    .btn-tool {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, background-color 0.15s;
    }
    .btn-tool:active {
      transform: scale(0.9);
      background: rgba(30, 41, 59, 0.95);
    }
    .btn-tool.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }
    .btn-tool.danger {
      background: #e11d48;
      border-color: #f43f5e;
      color: #ffffff;
    }
    .btn-main {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 2px solid #38bdf8;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(2, 132, 199, 0.5);
      transition: transform 0.1s;
    }
    .btn-main:active {
      transform: scale(0.92);
    }

    /* OLED Dimmer */
    .dimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
    }
    .dimmer.active {
      display: flex;
    }
    .dimmer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-bottom: 12px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Camera Viewfinder -->
  <video id="cameraView" autoplay playsinline muted></video>

  <!-- Focus Ring Element -->
  <div class="focus-ring" id="focusRing"></div>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <!-- Top Header -->
    <div class="top-header-box ui-interactive">
      <div class="top-header">
        <div class="status-badge">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting...</span>
        </div>

        <div class="top-actions">
          <div class="room-badge" id="roomBadge">ROOM: ----</div>
          <button class="btn-disconnect-header" id="btnDisconnectHeader" title="Disconnect & Exit">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Exit</span>
          </button>
        </div>
      </div>

      <!-- Live Telemetry -->
      <div class="telemetry-row">
        <div class="telemetry-pill">
          <span>Mode:</span>
          <span class="telemetry-val" id="telemetryMode">P2P HD</span>
        </div>
        <div class="telemetry-pill">
          <span>FPS:</span>
          <span class="telemetry-val" id="telemetryFps">30</span>
        </div>
        <div class="telemetry-pill">
          <span>Latency:</span>
          <span class="telemetry-val" id="telemetryPing">~5ms</span>
        </div>
      </div>
    </div>

    <!-- Standby Switcher Banner -->
    <div class="standby-banner ui-interactive" id="standbyBanner">
      <div class="standby-text">Another phone is broadcasting</div>
      <button class="btn-takeover" id="btnTakeover">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Switch to This Phone</span>
      </button>
    </div>

    <!-- Bottom Controls with Clean SVG Icons -->
    <div class="bottom-controls-box ui-interactive">
      <div class="bottom-controls">
        <!-- Flashlight / Torch Button -->
        <button class="btn-tool" id="btnTorch" title="Flashlight">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </button>

        <!-- Mute / Unmute Mic Button -->
        <button class="btn-tool" id="btnMute" title="Microphone">
          <svg id="svgMicOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <svg id="svgMicOff" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" style="display: none;">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Flip Camera Button (Center Main) -->
        <button class="btn-main" id="btnFlip" title="Flip Camera">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
            <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m18 22-3-3 3-3"></path>
            <path d="m6 2 3 3-3 3"></path>
          </svg>
        </button>

        <!-- OLED Battery Saver Dimmer -->
        <button class="btn-tool" id="btnDimmer" title="OLED Battery Saver">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Disconnect Action Button -->
        <button class="btn-tool danger" id="btnExitBottom" title="Disconnect">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- OLED Battery Saver Overlay -->
  <div class="dimmer" id="dimmerOverlay">
    <div class="dimmer-dot"></div>
    <div style="font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px;">Live Streaming to PC</div>
    <div style="font-size: 11px; margin-top: 6px; color: #64748b;">Screen power saved • Tap anywhere to wake</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetRoom = (urlParams.get("room") || "DEFAULT").toUpperCase();
    const SERVER_URL = window.location.origin;

    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:stun3.l.google.com:19302" },
        { urls: "stun:stun4.l.google.com:19302" },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelay",
          credential: "openrelay"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelay",
          credential: "openrelay"
        }
      ],
      iceCandidatePoolSize: 10
    };

    let localStream = null;
    let peerConnection = null;
    let socket = null;
    let currentFacing = "environment";
    let isMuted = false;
    let isTorchOn = false;
    let iceQueue = [];
    let frameInterval = null;
    let isBroadcaster = true;
    let myDeviceName = "Phone Camera (" + (navigator.userAgent.includes("iPhone") ? "iOS" : "Android") + ")";

    const offscreenCanvas = document.createElement("canvas");
    const offscreenCtx = offscreenCanvas.getContext("2d");

    // DOM Elements
    const cameraView = document.getElementById("cameraView");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const roomBadge = document.getElementById("roomBadge");
    const btnDisconnectHeader = document.getElementById("btnDisconnectHeader");
    const btnExitBottom = document.getElementById("btnExitBottom");
    const standbyBanner = document.getElementById("standbyBanner");
    const btnTakeover = document.getElementById("btnTakeover");
    const btnFlip = document.getElementById("btnFlip");
    const btnTorch = document.getElementById("btnTorch");
    const btnMute = document.getElementById("btnMute");
    const svgMicOn = document.getElementById("svgMicOn");
    const svgMicOff = document.getElementById("svgMicOff");
    const btnDimmer = document.getElementById("btnDimmer");
    const dimmerOverlay = document.getElementById("dimmerOverlay");
    const focusRing = document.getElementById("focusRing");
    const telemetryMode = document.getElementById("telemetryMode");
    const telemetryPing = document.getElementById("telemetryPing");

    roomBadge.textContent = "ROOM: " + targetRoom;

    function haptic() {
      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function setStatus(text, type = "normal") {
      if (statusText) statusText.textContent = text;
      if (statusDot) {
        statusDot.className = "status-dot";
        if (type === "connected") statusDot.classList.add("connected");
        if (type === "standby") statusDot.classList.add("standby");
        if (type === "error") statusDot.classList.add("error");
      }
    }

    function updateBroadcasterState(active) {
      isBroadcaster = active;
      if (isBroadcaster) {
        standbyBanner.classList.remove("active");
        setStatus("Live (Active)", "connected");
        if (telemetryMode) telemetryMode.textContent = "WebRTC P2P";
      } else {
        standbyBanner.classList.add("active");
        setStatus("Standby", "standby");
      }
    }

    function exitStream() {
      haptic();
      if (frameInterval) clearInterval(frameInterval);
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
      }
      if (socket) {
        socket.disconnect();
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage("disconnect");
      } else {
        window.location.reload();
      }
    }

    btnDisconnectHeader.addEventListener("click", exitStream);
    btnExitBottom.addEventListener("click", exitStream);

    // Tap to focus animation
    window.addEventListener("click", (e) => {
      if (e.target.closest("button") || e.target.closest(".ui-interactive")) return;
      if (focusRing) {
        focusRing.style.left = e.clientX + "px";
        focusRing.style.top = e.clientY + "px";
        focusRing.classList.add("active");
        setTimeout(() => focusRing.classList.remove("active"), 800);
      }
    });

    // Fallback frame streaming
    function startFrameStreaming() {
      if (frameInterval) clearInterval(frameInterval);
      frameInterval = setInterval(() => {
        if (
          socket &&
          socket.connected &&
          targetRoom &&
          localStream &&
          cameraView.videoWidth > 0 &&
          isBroadcaster
        ) {
          const w = 640;
          const h = Math.round((w * cameraView.videoHeight) / cameraView.videoWidth) || 480;
          if (offscreenCanvas.width !== w || offscreenCanvas.height !== h) {
            offscreenCanvas.width = w;
            offscreenCanvas.height = h;
          }
          offscreenCtx.drawImage(cameraView, 0, 0, w, h);
          const dataUrl = offscreenCanvas.toDataURL("image/jpeg", 0.6);
          socket.emit("video-frame", {
            roomId: targetRoom,
            image: dataUrl,
            fromSocketId: socket.id
          });
        }
      }, 40);
    }

    // Start Camera & High Quality Audio
    async function initCamera(facingMode = currentFacing) {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }

      const audioConstraints = isMuted ? false : {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      };

      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: audioConstraints
        });
      } catch (e1) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode },
            audio: audioConstraints
          });
        } catch (e2) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          } catch (e3) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            } catch (e4) {
              console.error("Camera access failed completely:", e4);
              setStatus("Camera Access Denied", "error");
              return;
            }
          }
        }
      }

      localStream = stream;
      cameraView.srcObject = localStream;
      cameraView.className = (facingMode === "user") ? "mirror" : "";
      currentFacing = facingMode;

      cameraView.onloadedmetadata = () => {
        cameraView.play().catch(() => {});
        startFrameStreaming();
      };
      startFrameStreaming();

      try {
        const videoTrack = localStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        btnTorch.style.display = capabilities.torch ? "flex" : "none";
      } catch (e) {}

      if (peerConnection && peerConnection.signalingState !== "closed") {
        const senders = peerConnection.getSenders();
        localStream.getTracks().forEach(track => {
          const sender = senders.find(s => s.track && s.track.kind === track.kind);
          if (sender) {
            sender.replaceTrack(track);
          }
        });
      }
    }

    // Toggle Torch
    async function toggleTorch() {
      haptic();
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({
          advanced: [{ torch: isTorchOn }]
        });
        btnTorch.classList.toggle("active", isTorchOn);
      } catch (err) {
        console.warn("Torch not supported:", err);
      }
    }

    // WebRTC Offer
    async function startWebRTCStream() {
      if (!targetRoom || !socket || !socket.connected) return;

      if (!localStream || !localStream.active || localStream.getVideoTracks().length === 0) {
        setStatus("Initializing camera...");
        await initCamera(currentFacing);
      }

      if (!localStream) {
        setStatus("Camera Unavailable", "error");
        return;
      }

      if (peerConnection && peerConnection.signalingState !== "closed") {
        try { peerConnection.close(); } catch (e) {}
      }

      peerConnection = new RTCPeerConnection(RTC_CONFIG);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && socket && socket.connected) {
          socket.emit("ice-candidate", {
            roomId: targetRoom,
            candidate: event.candidate,
            from: "mobile",
            fromSocketId: socket.id
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        if (state === "connected") {
          if (frameInterval) {
            clearInterval(frameInterval);
            frameInterval = null;
          }
          updateBroadcasterState(isBroadcaster);
        } else if (state === "disconnected" || state === "failed") {
          startFrameStreaming();
          setStatus("Reconnecting...", "error");
        }
      };

      try {
        const offer = await peerConnection.createOffer({
          offerToReceiveVideo: false,
          offerToReceiveAudio: false
        });
        await peerConnection.setLocalDescription(offer);

        socket.emit("webrtc-offer", {
          roomId: targetRoom,
          sdp: offer,
          from: "mobile",
          fromSocketId: socket.id,
          deviceName: myDeviceName
        });
      } catch (err) {
        console.error("WebRTC Offer error:", err);
      }
    }

    // Connect Socket.IO
    function connectSocket() {
      setStatus("Connecting to server...");

      if (socket) {
        socket.disconnect();
      }

      socket = io(SERVER_URL, {
        transports: ["websocket", "polling"],
        timeout: 10000
      });

      socket.on("connect", () => {
        setStatus("Joining room...");
        if (telemetryPing) telemetryPing.textContent = "<10ms";
        socket.emit("join-room", {
          roomId: targetRoom,
          clientType: "mobile",
          deviceName: myDeviceName
        }, (res) => {
          if (res) {
            updateBroadcasterState(res.isBroadcasting !== false);
          }
        });
        setTimeout(startWebRTCStream, 400);
      });

      socket.on("peer-joined", async (data) => {
        if (data.clientType === "desktop") {
          setStatus("Desktop connected...", "connected");
          await startWebRTCStream();
        }
      });

      socket.on("active-camera-changed", (data) => {
        const amIActive = data.activeSocketId === socket.id;
        updateBroadcasterState(amIActive);
      });

      socket.on("device-list-updated", (data) => {
        if (data.activeSocketId) {
          updateBroadcasterState(data.activeSocketId === socket.id);
        }
      });

      socket.on("webrtc-answer", async (data) => {
        if (!peerConnection) return;
        try {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          while (iceQueue.length > 0) {
            const cand = iceQueue.shift();
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
            } catch (e) {}
          }
          updateBroadcasterState(isBroadcaster);
        } catch (err) {
          console.error("Remote desc error:", err);
        }
      });

      socket.on("ice-candidate", async (data) => {
        try {
          if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          } else {
            iceQueue.push(data.candidate);
          }
        } catch (err) {}
      });

      socket.on("peer-disconnected", (data) => {
        if (data && data.allDisconnected) {
          setStatus("Desktop disconnected", "error");
        }
      });

      socket.on("connect_error", () => {
        setStatus("Server offline", "error");
      });
    }

    // Takeover Button
    btnTakeover.addEventListener("click", () => {
      haptic();
      if (socket && socket.connected && targetRoom) {
        socket.emit("switch-active-camera", {
          roomId: targetRoom,
          targetSocketId: socket.id
        });
        updateBroadcasterState(true);
      }
    });

    // Flip Camera Button
    btnFlip.addEventListener("click", () => {
      haptic();
      const nextFacing = (currentFacing === "environment") ? "user" : "environment";
      isTorchOn = false;
      btnTorch.classList.remove("active");
      initCamera(nextFacing);
    });

    btnTorch.addEventListener("click", toggleTorch);

    // Mute Microphone Button
    btnMute.addEventListener("click", () => {
      haptic();
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      btnMute.classList.toggle("danger", isMuted);
      if (isMuted) {
        svgMicOn.style.display = "none";
        svgMicOff.style.display = "block";
      } else {
        svgMicOn.style.display = "block";
        svgMicOff.style.display = "none";
      }
    });

    // OLED Dimmer Button
    btnDimmer.addEventListener("click", () => {
      haptic();
      dimmerOverlay.classList.add("active");
    });

    dimmerOverlay.addEventListener("click", () => {
      dimmerOverlay.classList.remove("active");
    });

    // Auto-init
    (async function init() {
      await initCamera("environment");
      connectSocket();
    })();
  </script>
</body>
</html>
